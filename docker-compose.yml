version: '3.8'

services:
  avry-blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avry-blog
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aivory-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avry-blog.rule=Host(`backend.aivory.id`) && PathPrefix(`/blog`)"
      - "traefik.http.routers.avry-blog.entrypoints=websecure"
      - "traefik.http.routers.avry-blog.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-blog.loadbalancer.server.port=8088"

networks:
  aivory-network:
    name: aivory-network
    external: true
